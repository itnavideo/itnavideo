<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=900, height=1600, initial-scale=1.0" />
  <title>Caption Test - Pixel Pop 2D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&family=Poppins:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700&family=Orbitron:wght@800;900&display=swap');
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      background: #090D16;
      background-image: radial-gradient(circle at 50% 50%, #1E293B 0%, #090D16 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Orbitron, sans-serif;
      box-sizing: border-box;
      overflow: hidden;
    }
    .badge-card {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 18px;
      max-width: 920px;
      background-color: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      padding: 12px 24px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .word {
      display: inline-block;
      font-size: 50.6px;
      font-weight: 800;
      color: #38BDF8;
      text-transform: none;
      -webkit-text-stroke: none;
      paint-order: stroke fill;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      transition: all 0.1s ease;
    }
    .word.active {
      color: #FACC15;
      font-weight: 900;
      transform: scale(1.12);
      text-shadow: 0 0 20px #FACC1588, 0 4px 14px rgba(0,0,0,0.9);
    }
    .info-footer {
      position: absolute;
      bottom: 60px;
      color: #94A3B8;
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="badge-card">
    <span class="word ">This</span>
    <span class="word ">is</span>
    <span class="word ">how</span>
    <span class="word ">you</span>
    <span class="word active">GROW</span>
    <span class="word ">your</span>
    <span class="word ">business,</span>
    <span class="word ">fast!</span>
  </div>
  <div class="info-footer">
    Preset: <strong>pixel-pop-2d</strong> (Pixel Pop 2D) | Font: Orbitron, sans-serif
  </div>
</body>
</html>

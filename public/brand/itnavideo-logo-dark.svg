<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="itnaPlayDarkGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="60%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#F4511E"/>
    </linearGradient>
    <filter id="itnaPlayDarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF5722" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid Rounded Play Triangle matching Reference Image -->
  <g transform="translate(12, 14) scale(0.56)" filter="url(#itnaPlayDarkGlow)">
    <path
      d="M 28 22 C 28 16 34 12.5 39 15.5 L 80 43.5 C 85 46.5 85 53.5 80 56.5 L 39 84.5 C 34 87.5 28 84 28 78 Z"
      fill="url(#itnaPlayDarkGrad)"
    />
  </g>

  <!-- Typography: 'Itna' in Crisp White, 'Video' in Flame Orange -->
  <text x="74" y="52" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Itna</tspan><tspan fill="#FF5722">Video</tspan>
  </text>
</svg>

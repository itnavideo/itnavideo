<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <!-- Vibrant Flame Orange Gradient for Stem -->
    <linearGradient id="wmDarkStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>

    <!-- Signature Flame Orange to Sunset Amber Gradient -->
    <linearGradient id="wmDarkAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Warm Gold Sparkle Gradient -->
    <linearGradient id="wmDarkSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <!-- Text Gradient for 'VIDEO' -->
    <linearGradient id="wmDarkTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Soft Ambient Glow on Dark Surface -->
    <filter id="wmDarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FF5722" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background (Transparent ready or solid preview) -->
  <rect width="640" height="160" rx="20" fill="#0A0D14"/>

  <!-- Left Kinetic AI Play Mark Icon -->
  <g transform="translate(36, 32) scale(0.96)" filter="url(#wmDarkGlow)">
    <!-- Left Vertical Ribbon Stem ('I' for ITNA) -->
    <rect x="14" y="14" width="18" height="72" rx="9" fill="url(#wmDarkStem)"/>

    <!-- Forward Kinetic Play Chevron ('▶' for VIDEO) -->
    <path
      d="M 38 18 C 38 14 42.5 11.5 46 13.8 L 84 45.8 C 87.2 48 87.2 52 84 54.2 L 46 86.2 C 42.5 88.5 38 86 38 82 Z"
      fill="url(#wmDarkAmber)"
    />

    <!-- AI Sparkle Star (✦) Top Right Corner -->
    <path
      d="M 80 12 C 80 18.6 85.4 24 92 24 C 85.4 24 80 29.4 80 36 C 80 29.4 74.6 24 68 24 C 74.6 24 80 18.6 80 12 Z"
      fill="url(#wmDarkSpark)"
    />
  </g>

  <!-- Typography: 'ITNA' in Crisp White, 'VIDEO' in Vibrant Orange/Amber Gradient -->
  <g transform="translate(150, 92)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="1.5">
      <tspan fill="#FFFFFF">ITNA</tspan>
      <tspan fill="url(#wmDarkTextGrad)">VIDEO</tspan>
    </text>

    <!-- AI Studio Pill Badge -->
    <rect x="350" y="-40" width="86" height="26" rx="6" fill="rgba(255, 160, 0, 0.15)" stroke="rgba(255, 160, 0, 0.40)" stroke-width="1.5"/>
    <text x="393" y="-23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFA000" letter-spacing="1">AI STUDIO</text>

    <!-- Tagline Subtitle -->
    <text x="2" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#94A3B8" letter-spacing="3.5">NEXT-GEN AI VIDEO ENGINE</text>
  </g>
</svg>

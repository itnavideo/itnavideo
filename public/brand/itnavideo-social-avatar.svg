<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Itnavideo social avatar</title>
  <desc id="desc">Itnavideo logo on a dark brand background for social media profiles.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="186" y1="166" x2="894" y2="914" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(278 220) rotate(45) scale(510)">
      <stop stop-color="#5eead4" stop-opacity=".36"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(844 246) rotate(135) scale(480)">
      <stop stop-color="#38bdf8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="144" y="140" width="792" height="792" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="34" stdDeviation="48" flood-color="#000000" flood-opacity=".42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#5eead4" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#050506"/>
  <rect width="1080" height="1080" fill="url(#glowA)"/>
  <rect width="1080" height="1080" fill="url(#glowB)"/>
  <g filter="url(#shadow)">
    <rect x="242" y="222" width="596" height="596" rx="132" fill="url(#brandGradient)"/>
    <rect x="277" y="257" width="526" height="526" rx="104" fill="#07110f" opacity=".18"/>
    <g transform="translate(270 252) scale(11.25)">
      <rect x="8" y="11" width="32" height="26" rx="7" fill="#020617" opacity=".92"/>
      <path d="M19 18.5v11l10-5.5-10-5.5Z" fill="#ffffff"/>
      <path d="M10 25h4m20 0h4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".94"/>
      <path d="M14 19v10M34 19v10" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M6 22v4M42 22v4" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/>
